name: Compute latest CV
  
on:
  push:
    branches:
      - '**'
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Create main TeX file
      run: |
        cd docs/
        curl https://perso.liris.cnrs.fr/nbarret/generate.php > CV-barret-test.tex
    - name: Compile LaTeX document
      uses: dante-ev/latex-action@latest
      with:
          root_file: docs/CV-barret-test.tex
    - name: Push generated CV
      run: |
          git config --global user.name 'Nelly Barret'
          git config --global user.email 'nelly.barret@insa-lyon.fr'
          git add *.pdf
          git add **/*.pdf
          git commit -m "Automated CV generation"
          git push
